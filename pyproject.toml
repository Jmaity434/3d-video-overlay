[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video3doverlay"
version = "0.1.0"
description = "Interactive real-time Panda3D overlays for video playback without transcoding."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Joy Maity" }]
dependencies = ["panda3d>=1.10.14"]

[project.optional-dependencies]
pygame = [
	"pygame>=2.5.0",
	"PyOpenGL>=3.1.7",
	"opencv-python>=4.8.0",
]
vision = [
	"opencv-python>=4.8.0",
	"moderngl>=5.8.0",
	"moderngl-window>=2.4.0",
]
depth = [
	"opencv-python>=4.8.0",
	"moderngl>=5.8.0",
	"moderngl-window>=2.4.0",
	"torch>=2.0.0",
	"torchvision>=0.15.0",
]
all = [
	"pygame>=2.5.0",
	"PyOpenGL>=3.1.7",
	"opencv-python>=4.8.0",
	"moderngl>=5.8.0",
	"moderngl-window>=2.4.0",
	"torch>=2.0.0",
	"torchvision>=0.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/video3doverlay"]

[tool.pytest.ini_options]
testpaths = ["tests"]