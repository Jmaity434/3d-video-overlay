[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video3doverlay"
version = "0.1.0"
description = "Interactive real-time Panda3D overlays for video playback without transcoding."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Joy Maity" }]
dependencies = ["panda3d>=1.10.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/video3doverlay"]

[tool.pytest.ini_options]
testpaths = ["tests"]